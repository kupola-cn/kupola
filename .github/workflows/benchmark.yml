name: Benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmarks
        run: npm run bench

      - name: Generate HTML report
        run: node benchmark/reports/generate-report.js

      - name: Check performance thresholds
        run: node benchmark/reports/check-thresholds.js

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark/reports/benchmark-report.html

      - name: Comment on PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const reportsDir = path.join(process.env.GITHUB_WORKSPACE, 'benchmark', 'reports');
            const coreResults = JSON.parse(fs.readFileSync(path.join(reportsDir, 'core-results.json'), 'utf8'));
            const componentsResults = JSON.parse(fs.readFileSync(path.join(reportsDir, 'components-results.json'), 'utf8'));
            const allResults = [...coreResults, ...componentsResults];
            
            let comment = '## Benchmark Results 📊\n\n';
            comment += '| Category | Test | Avg Time | Status |\n';
            comment += '|----------|------|---------|--------|\n';
            
            allResults.forEach(test => {
              const category = test.category === 'core' ? 'Core' : 'Components';
              const status = test.avgTime < 500 ? '✅' : '⚠️';
              comment += `| ${category} | ${test.test} | ${test.avgTime.toFixed(2)}ms | ${status} |\n`;
            });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });